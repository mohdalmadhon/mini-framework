<!DOCTYPE html>
<!-- Shown by `npx serve` for a real URL that does not exist (e.g. /nope).
     Unknown "#/paths" inside the app are handled by the framework router (toio/pages.js). -->
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#2b8f89">
    <title>Page not found - TOIO</title>
    <link rel="icon" type="image/svg+xml" href="/toio/logo.svg">
    <link rel="stylesheet" href="/toio/toio.css">
</head>

<body>
    <main class="error-page">
        <div class="error-card" role="alert">
            <p class="error-code">404</p>
            <h1 class="error-title">Page not found</h1>
            <p class="error-msg">We couldn't find the page you were looking for. It may have moved, or the link is wrong.</p>
            <div class="error-actions">
                <a class="btn primary" href="/">Back to home</a>
            </div>
        </div>
    </main>
</body>

</html>
